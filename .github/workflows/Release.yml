# On a release tag (v*): build the terminal app's packages (pyproject.toml —
# the wheel carries the Julia library inside), publish them to PyPI, and
# attach them to the GitHub release.
#
# PyPI accepts them through a "trusted publisher" (OpenID Connect): no token
# is stored anywhere. It is set up once on PyPI (Account → Publishing):
# project asteroidpipeline, owner Richard7987, repository
# AsteroidPipeline.jl, workflow Release.yml, environment pypi.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build the wheel and the source distribution
        run: |
          python -m pip install --upgrade build
          python -m build
          mkdir -p sums && (cd dist && sha256sum -- *) > sums/SHA256SUMS
      - name: Check the wheel installs and runs
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/asteroidpipeline --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/
            sums/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/asteroidpipeline/
    permissions:
      id-token: write          # what the trusted publisher checks
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  github-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - name: Attach the packages to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            sums/SHA256SUMS
          generate_release_notes: true
