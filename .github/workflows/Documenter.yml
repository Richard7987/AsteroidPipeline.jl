# Builds the documentation — every version: dev (main), each release tag,
# and stable — with docs/build_all_versions.sh, and deploys it via GitHub's
# native "deploy from GitHub Actions" Pages mechanism: an artifact upload
# plus actions/deploy-pages, not a push to a gh-pages branch. That
# branch-push approach (DocumenterVitepress.deploydocs) was tried first and
# kept breaking: this repo's real origin is a self-hosted Forgejo instance
# that mirrors to GitHub, and Forgejo's mirror sync forces GitHub to exactly
# match it — which means it deletes gh-pages on every sync, since that
# branch only ever existed on the GitHub side. Publishing straight from a
# workflow artifact has no branch for the mirror to touch; the price is that
# each deploy rebuilds every version, since a deploy replaces the whole site.
name: Documenter

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0        # every release tag, to build its version
      - name: Setup Julia
        uses: julia-actions/setup-julia@v3
      - name: Load Julia packages from cache
        id: julia-cache
        uses: julia-actions/cache@v3
      - name: Build every version
        run: docs/build_all_versions.sh docs/pages-site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save Julia depot cache on cancel or failure
        if: cancelled() || failure()
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.julia-cache.outputs.cache-paths }}
          key: ${{ steps.julia-cache.outputs.cache-key }}
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/pages-site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
