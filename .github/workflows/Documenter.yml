# Builds docs/ (Documenter.jl + DocumenterVitepress.jl) and deploys it via
# GitHub's native "deploy from GitHub Actions" Pages mechanism — an
# artifact upload plus actions/deploy-pages, not a push to a gh-pages
# branch. That branch-push approach (DocumenterVitepress.deploydocs) was
# tried first and kept breaking: this repo's real origin is a self-hosted
# Forgejo instance that mirrors to GitHub, and Forgejo's mirror sync
# forces GitHub to exactly match it — which means it deletes gh-pages on
# every sync, since that branch only ever existed on the GitHub side
# (created by this very workflow). See docs/make.jl's top comment and the
# Investigation Log for the full diagnosis. Publishing straight from a
# workflow artifact has no branch for the mirror to touch.
name: Documenter

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Julia
        uses: julia-actions/setup-julia@v3
      - name: Load Julia packages from cache
        id: julia-cache
        uses: julia-actions/cache@v3
      - name: Build docs
        # docs/make.jl doesn't call deploydocs anymore, but GITHUB_TOKEN is
        # still needed: makedocs itself picks the "dev" vs root base path
        # from Documenter's deploy-criteria check, which requires it — a
        # real deploy without it built for root and 404'd every asset once
        # nested under dev/ below.
        uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JULIA_DEBUG: "Documenter"
      - name: Save Julia depot cache on cancel or failure
        if: cancelled() || failure()
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.julia-cache.outputs.cache-paths }}
          key: ${{ steps.julia-cache.outputs.cache-key }}
      # docs/build/1 is the fully-built Vitepress static site for the
      # "dev" base (docs/build/bases.txt lists the bases DocumenterVitepress
      # built; this project only ever has one, "dev" — no tagged releases
      # yet). Replicates, as plain files instead of a git-branch merge,
      # exactly what DocumenterVitepress's own deploydocs used to write at
      # the branch root (see DocumenterVitepress.jl's
      # postprocess_before_push/write_redirect_index!): a `dev/` subfolder
      # holding the site, a root index.html that redirects to it, and
      # versions.js for the version-picker widget.
      - name: Assemble Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          site=docs/pages-site
          mkdir -p "$site/dev"
          cp -r docs/build/1/. "$site/dev/"
          touch "$site/.nojekyll"
          printf '%s\n' \
            '<!--This file is automatically generated by DocumenterVitepress.jl-->' \
            '<meta http-equiv="refresh" content="0; url=./dev/"/>' \
            > "$site/index.html"
          printf '%s\n' \
            'var DOC_VERSIONS = [' \
            '  "dev",' \
            '];' \
            > "$site/versions.js"
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/pages-site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
