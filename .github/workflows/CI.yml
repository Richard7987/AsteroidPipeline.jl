name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the oldest Julia Project.toml allows, and the newest release: the
        # General registry installs the package on the oldest, and a compat
        # bound only the newest satisfies (p7zip_jll's, in 0.2.1) passes
        # everywhere but there
        version: ['1.11', '1']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
