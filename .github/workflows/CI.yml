name: CI

on:
  push:
    # every branch: they arrive through the Forgejo mirror, never as pull requests
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    permissions:
      contents: read
      id-token: write    # Codecov's upload, authenticated by OIDC: no token stored
    name: Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the oldest Julia Project.toml allows, and the newest release: the
        # General registry installs the package on the oldest, and a compat
        # bound only the newest satisfies (p7zip_jll's, in 0.2.1) passes
        # everywhere but there
        version: ['1.11', '1']
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      # digest2, the MPC's orbit-class program, for digest2_score's tests:
      # built from its repository, at a fixed commit
      - name: Build digest2
        run: |
          sudo apt-get install -y -qq libxml2-dev
          git clone -q https://github.com/Smithsonian/digest2.git "$RUNNER_TEMP/digest2"
          git -C "$RUNNER_TEMP/digest2" checkout -q d324a4816fc49e9c7624335a6aa5499d7fdf3b9a
          make -s -C "$RUNNER_TEMP/digest2/digest2"
          echo "DIGEST2_PATH=$RUNNER_TEMP/digest2/digest2/digest2" >> "$GITHUB_ENV"
      - uses: julia-actions/julia-runtest@v1
      # coverage measured once, on the newest release
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.version == '1'
      - uses: codecov/codecov-action@v7
        if: matrix.version == '1'
        with:
          files: lcov.info
          # only lcov.info: no search for other reports, and none of the
          # gcov/xcode/coverage.py plugins, which have nothing to find here
          disable_search: true
          plugins: noop
          use_oidc: true
          fail_ci_if_error: false
