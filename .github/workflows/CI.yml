name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    permissions:
      contents: read
      id-token: write    # Codecov's upload, authenticated by OIDC: no token stored
    name: Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the oldest Julia Project.toml allows, and the newest release: the
        # General registry installs the package on the oldest, and a compat
        # bound only the newest satisfies (p7zip_jll's, in 0.2.1) passes
        # everywhere but there
        version: ['1.11', '1']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      # coverage measured once, on the newest release
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.version == '1'
      - uses: codecov/codecov-action@v5
        if: matrix.version == '1'
        with:
          files: lcov.info
          use_oidc: true
          fail_ci_if_error: false
